capsule_fill = "primary"
capsule_padding = 7
capsule_radius = 3
icon_color = "on_primary"
scale = 1.4000000000000001
type = "launcher"

[widget.lock_keys]
display = "short"
hide_when_off = false
show_caps_lock = true
show_num_lock = true
show_scroll_lock = false
type = "lock_keys"

[widget.media]
art_size = 16.0
enabled = false
max_length = 220.0
min_length = 80.0
title_scroll = "none"
type = "media"

[widget.network]
capsule_padding = 7
show_label = false
type = "network"
vpn_status = "hidden"

[widget.network_rx]
glyph = "arrow-big-down-filled"
network_speed_compact = true
stat = "net_rx"
type = "sysmon"
visualization = "none"

[widget.network_tx]
glyph = "arrow-big-up-filled"
network_speed_compact = true
stat = "net_tx"
type = "sysmon"
visualization = "none"

[widget.notes]
scale = 1.4000000000000001
type = "noctalia/notes:notes"

[widget.notifications]
anchor = true
capsule_radius = 10
scale = 1.3
type = "notifications"

[widget.output_volume]
device = "output"
type = "volume"

[widget.ram]
stat = "ram_used"
type = "sysmon"
visualization = "none"

[widget.session]
capsule = true
capsule_fill = "primary"
capsule_padding = 7
capsule_radius = 4
color = "on_primary"
font_family = "Adwaita Mono"
font_weight = 700
scale = 1.2
type = "session"

[widget.spacer]
interactive = false
type = "spacer"

[widget.status]
show_city = false
show_icon = false
show_state = false
type = "pk/geoip-monitor:status"

[widget.status_2]
show_count = false
type = "3dprogramin/ufw:status"

[widget.sysmon]
enabled = false
type = "sysmon"
visualization = "none"

[widget.temp]
stat = "cpu_temp"
type = "sysmon"
visualization = "none"

[widget.wallpaper]
enabled = false
type = "wallpaper"

[widget.weather]
capsule_padding = 5
type = "weather"

[widget.widget]
scale = 1.3
type = "blackbartblues/keymap:widget"

[widget.workspaces]
scale = 1.2
type = "workspaces"
