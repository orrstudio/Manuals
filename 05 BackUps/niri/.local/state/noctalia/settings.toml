[nightlight]
enabled = true

[osd.kinds]
power_profile = false

[plugin_settings."3dprogramin/ufw"]
panel_layer = "overlay"

[plugin_settings."blackbartblues/keymap"]
compositor = "niri"

[plugin_settings."kenn/keybind-cheatsheet"]
cheatsheet_layer = "overlay"
cheatsheet_open_near_click = false
cheatsheet_placement = "attached"
cheatsheet_position = "auto"
columns = 2
compositor = "niri"

[plugin_settings."mera/localsend"]
