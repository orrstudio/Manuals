glyph = "volume"
tooltip = """Озвучить буфер обмена
Горячая клавиша: Pause"""
type = "custom_button"

    [widget.say-clipboard.actions]
    left = "exec /home/orr/.local/bin/say-clipboard"

[widget.session]
capsule = true
capsule_fill = "primary"
capsule_padding = 7
capsule_radius = 4
color = "on_primary"
font_family = "Adwaita Mono"
font_weight = 700
scale = 1.2

[widget.status]
show_city = false
show_icon = false
show_state = false
type = "pk/geoip-monitor:status"

[widget.status_2]
show_count = false
type = "3dprogramin/ufw:status"

[widget.sw-record]
glyph = "microphone-filled"
tooltip = """Голосовой ввод SuperWhisper
Запись + автостоп через 60 секунд
Горячая клавиша: Ctrl+Tab"""
type = "custom_button"

    [widget.sw-record.actions]
    left = "exec /home/orr/.local/bin/sw-start.sh"

[widget.sysmon]
enabled = false
visualization = "none"

[widget.temp]
visualization = "none"

[widget.wallpaper]
enabled = false

[widget.weather]
capsule_padding = 5

[widget.widget]
scale = 1.3
type = "blackbartblues/keymap:widget"

[widget.workspaces]
scale = 1.2