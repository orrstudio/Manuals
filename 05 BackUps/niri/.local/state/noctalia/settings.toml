panel_layer = "overlay"

[plugin_settings."piero-93/thinkpad-fan"]
panel_layer = "overlay"

[plugin_settings."pozzoo/hassio"]
ha_url = "http:/182.168.10.20:8123"

[plugin_settings."rylos/usb-manager"]
scan_interval = 30

[plugin_settings."umedbazarov/layout-fix"]
dictionaries = "install"

[plugins]
enabled = [
    "dunarand/bookmarks",
    "yuuto/calculator",
    "dotnetrob/cat",
    "thaer99ob/default-apps",
    "nightwatch75/dns-switcher",
    "pk/geoip-monitor",
    "hy4ri/herdr",
    "blackbartblues/keymap",
    "noctalia/notes",
    "3dprogramin/ufw",
    "rylos/usb-manager",
    "andrewdems/vpn-manager"
]

[shell]
app_icon_colorize = true
corner_radius_scale = 2.0
font_family = "Adwaita Sans"
lang = "ru"
niri_overview_close_on_launch_enabled = true
niri_overview_type_to_launch_enabled = true
panel_anchor_bar = "OrrPanel"
polkit_agent = true

    [shell.keyboard_layout.custom_labels]
    "English (US)" = "EN"
    Russian = "RU"

    [shell.launcher]
    app_grid = true
    pinned = [ "org.gnome.Nautilus", "terminator", "org.gnome.gedit" ]
    sort_by_usage = false

    [shell.panel]
    list_item_background = true
    transparency_mode = "soft"

    [shell.screenshot]
    directory = "/home/orr/Pictures/Screenshots"
    remember_last_region = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
builtin = "Gruvbox"
community_palette = "Oxocarbon"
mode = "dark"
pure_black_dark = true
shell_mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
fill_mode = "stretch"
transition_on_startup = true

    [wallpaper.default]
    path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

    [wallpaper.last]
    path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[weather]
refresh_minutes = 60

[widget.bar]
capsule_padding = 7
enable_scroll = false
glyph = "grid-dots"
scale = 1.4000000000000001
text = ""
type = "dunarand/bookmarks:bar"

[widget.bar_2]
scale = 1.55
show_bar_value = false
type = "yuuto/calculator:bar"

[widget.bar_3]
type = "hy4ri/herdr:bar"

[widget.bar_4]
hide_when_empty = false
show_count = false
type = "rylos/usb-manager:bar"

[widget.bar_5]
type = "andrewdems/vpn-manager:bar"

[widget.bluetooth]
capsule_fill = "primary"
capsule_radius = 3
icon_color = "on_primary"

[widget.brightness]
enabled = false

[widget.cat]
show_cpu_percent = true
type = "dotnetrob/cat:cat"

[widget.clipboard]
glyph = "clipboard-check-filled"
scale = 1.4000000000000001

[widget.clock]
capsule = true
capsule_padding = 7
format = "{:%H:%M:%S}"

[widget.control-center]
anchor = true
capsule = true
capsule_fill = "primary"
capsule_padding = 7
capsule_radius = 3
glyph = "power"
icon_color = "on_primary"
scale = 1.4000000000000001

[widget.current]
type = "thaer99ob/default-apps:current"

[widget.date]
capsule_padding = 7
format = "{:%a, %d %B}"

[widget.dns-switcher]
show_label = false
type = "nightwatch75/dns-switcher:dns-switcher"

[widget.keyboard_layout]
capsule = true
capsule_fill = "primary"
capsule_radius = 4
color = "on_primary"
font_scale = 1.2
hide_when_single_layout = false
show_glyph = false

[widget.laptop-panel]
capsule_padding = 7
glyph = "device-laptop"
scale = 1.4000000000000001
tooltip = """Переключить панель ноутбука (eDP-1)
Горячая клавиша: Mod+Shift+F1"""
type = "custom_button"

    [widget.laptop-panel.actions]
    left = "exec /home/orr/.local/bin/toggle-laptop-panel.sh"

[widget.launcher]
capsule_border = "primary"
capsule_fill = "primary"
capsule_padding = 7
capsule_radius = 3
icon_color = "on_primary"
scale = 1.4000000000000001

[widget.media]
enabled = false

[widget.network]
capsule_padding = 7
show_label = false
vpn_status = "hidden"

[widget.network_rx]
glyph = "arrow-big-down-filled"
network_speed_compact = true
stat = "net_rx"
type = "sysmon"
visualization = "none"

[widget.network_tx]
glyph = "arrow-big-up-filled"
network_speed_compact = true
stat = "net_tx"
type = "sysmon"
visualization = "none"

[widget.notes]
scale = 1.4000000000000001
type = "noctalia/notes:notes"

[widget.notifications]
anchor = true
capsule_radius = 10
scale = 1.3

[widget.ram]
visualization = "none"

[widget.say-clipboard]
