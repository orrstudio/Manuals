        radius = 3.0

        [[bar.OrrPanel.capsule_group]]
        accordion = true
        accordion_delay_ms = 25
        accordion_direction = "start"
        border_width = 1.0
        enabled = true
        fill = "surface_container"
        id = "g2"
        members = [ "network", "status", "dns-switcher", "bar_5", "status_2" ]
        opacity = 1.0
        padding = 2.0

        [[bar.OrrPanel.capsule_group]]
        accordion = false
        accordion_delay_ms = 25
        accordion_direction = "end"
        accordion_duration = 200
        border_width = 1.0
        enabled = true
        fill = "primary"
        foreground = "on_primary"
        id = "g3"
        members = [ "network_rx", "network_tx" ]
        opacity = 1.0
        padding = 2.0
        radius = 8.0

        [[bar.OrrPanel.capsule_group]]
        accordion = true
        accordion_delay_ms = 25
        accordion_direction = "start"
        border_width = 1.0
        enabled = true
        fill = "surface_container"
        id = "g5"
        members = [ "bar", "laptop-panel", "widget", "bar_2", "notes", "current" ]
        opacity = 1.0
        padding = 2.0

        [[bar.OrrPanel.capsule_group]]
